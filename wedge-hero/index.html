<!DOCTYPE html>
<html lang="en">
<head>

  <title>Wedge — The Operating System for Healthcare AI Agents</title>
  <link rel="stylesheet" href="styles.css" />

<body>

  <section class="hero" data-node-id="395:378">

    <!-- backdrop: looping video, dimmed and graded toward the bottom -->

      <video class="hero__video" src="assets/hero.mp4" poster="assets/hero-poster.jpg"

    </div>

    <!-- logo (395:407) -->
    <a class="hero__logo" href="#" aria-label="Wedge" data-node-id="395:407">

    </a>

          <path d="M2.5 6h7M6.5 3l3 3-3 3" fill="none" stroke="#1b1b21"

    <!-- title, label (395:398) -->

      <button class="cta" type="button" data-node-id="395:391">

          <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
            <path d="M10 1.7a8.3 8.3 0 1 0 0 16.6 8.3 8.3 0 0 0 0-16.6Zm0 3.1a5.2 5.2 0 1 1 0 10.4 5.2 5.2 0 0 1 0-10.4Z" fill="#fff" opacity=".55"/>

    <div class="stats" data-node-id="395:429">

        <div class="stat__body">

      </div>
