<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEDUR — The roof that makes you feel at home</title>

  <!-- Fallback fonts while the real ones are not installed -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=Inter:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ============ FONTS ============
       The design uses Owners (Medium) for the headline and
       Overused Grotesk (SemiBold/Bold) for everything else.

       1. Overused Grotesk is FREE (SIL OFL):
          https://github.com/RandomMaerks/Overused-Grotesk
          -> take OverusedGrotesk-SemiBold.woff2 and
             OverusedGrotesk-Bold.woff2 from featured/webfonts
             and drop them into ./fonts/

       2. Owners is a commercial typeface (Fenotype). Either activate
          it through Adobe Fonts (add the web-project <link> here), or
          put a licensed Owners-Medium.woff2 into ./fonts/.

       When the files are missing the @font-face rules silently fail
       and the page falls back to Archivo/Inter below. */

    @font-face {
      font-family: "Owners";
      src: url("./fonts/Owners-Medium.woff2") format("woff2");
      font-weight: 500;
      font-display: swap;
    }

    @font-face {
      font-family: "Overused Grotesk";
      src: url("./fonts/OverusedGrotesk-SemiBold.woff2") format("woff2");
      font-weight: 600;
      font-display: swap;
    }

    @font-face {
      font-family: "Overused Grotesk";
      src: url("./fonts/OverusedGrotesk-Bold.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --font-display: "Owners", "Archivo", "Inter", sans-serif;
      --font-body: "Overused Grotesk", "Inter", "Helvetica Neue", sans-serif;
      --white-70: rgba(255, 255, 255, 0.7);
      --white-20: rgba(255, 255, 255, 0.2);
      --white-05: rgba(255, 255, 255, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    /* ============ HERO ============ */

    .hero {
      position: relative;
      height: 100vh;
      min-height: 640px;
      overflow: hidden;
      background: #060c1c;
    }

    .hero__scene,
    .hero__scene canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* static gradient shown only if WebGL is unavailable */
    .hero__fallback {
      position: absolute;
      inset: 0;
      display: none;
      background:
        radial-gradient(ellipse 60% 45% at 62% 55%, rgba(255, 170, 80, 0.3), transparent 70%),
        linear-gradient(180deg, #050a1a 0%, #0c1731 55%, #16264c 80%, #233459 100%);
    }

    .hero__fallback.is-visible { display: block; }

    /* soft darkening so the copy stays readable over the scene */
    .hero__shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(2, 4, 12, 0.25) 0%, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.66) 100%);
    }

    /* ============ HEADER ============ */

    .hero__header {
      position: absolute;
      top: 40px;
      left: 40px;
      right: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .logo {
      width: 50px;
      height: 40px;
      flex-shrink: 0;
    }

    .nav {
      display: flex;
      gap: 40px;
      position: absolute;
      left: 137px;
      top: 50%;
      transform: translateY(-50%);
    }

    .nav a {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.12px;
      text-transform: uppercase;
      color: var(--white-70);
      text-decoration: none;
      transition: color 0.25s ease;
    }

    .nav a:hover { color: #fff; }

    .cta {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 40px;
      padding: 4px 12px 4px 4px;
      border: 1px solid var(--white-05);
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: border-color 0.25s ease, background 0.25s ease;
    }

    .cta:hover {
      border-color: var(--white-20);
      background: rgba(255, 255, 255, 0.06);
    }

    .cta__thumb {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      background:
        repeating-linear-gradient(100deg, #6d4a2e 0 6px, #7d5636 6px 12px, #5c3d24 12px 19px),
        #6d4a2e;
    }

    .cta__arrow {
      width: 16px;
      height: 16px;
      display: block;
    }

    /* ============ COPY ============ */

    .hero__copy {
      position: absolute;
      left: 40px;
      right: 40px;
      bottom: 64px;
      z-index: 5;
      will-change: transform;
    }

    .hero__copy-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--white-20);
    }

    .hero__title {
      font-family: var(--font-display);
      font-size: clamp(40px, 5vw, 72px);
      font-weight: 500;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .hero__title .dim { color: var(--white-70); }

    .hero__subtitle {
      max-width: 462px;
      padding-bottom: 8px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: var(--white-70);
    }

    /* ============ DEMO SECTION BELOW ============ */

    .after-hero {
      min-height: 60vh;
      display: grid;
      place-items: center;
      background: #0a0a0a;
      color: rgba(255, 255, 255, 0.35);
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 900px) {
      .nav { display: none; }

      .hero__copy-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 24px;
      }
    }
  </style>
</head>
<body>
  <section class="hero" id="hero">
    <div class="hero__scene" id="scene3d"></div>
    <div class="hero__fallback" id="sceneFallback"></div>
    <div class="hero__shade"></div>

    <div class="hero__copy" id="heroCopy">
      <div class="hero__copy-row">
        <h1 class="hero__title">
          The roof that<br />makes you feel<br /><span class="dim">at home.</span>
        </h1>
        <p class="hero__subtitle">
          CEDUR brings the warm aesthetic of natural cedar shakes and the
          enduring performance of engineered materials to every roof.
        </p>
      </div>
    </div>

    <header class="hero__header">
      <!-- CEDUR shield: white shield with the wordmark and a roof mark
           knocked out. Redrawn from the Figma logo; for the 1:1 original
           select the "logo" layer in Figma and Copy as SVG. -->
      <svg class="logo" viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg" aria-label="CEDUR">
        <defs>
          <mask id="logoKnockout">
            <rect width="50" height="40" fill="#fff" />
            <text x="25" y="21.5" text-anchor="middle" fill="#000"
                  font-family="Archivo, Inter, sans-serif" font-size="11"
                  font-weight="700" letter-spacing="0.6">CEDUR</text>
            <path d="M25 25.5 l4.4 5.2 h-8.8 Z" fill="#000" />
          </mask>
        </defs>
        <path d="M1.5 1.5 H48.5 V21 C48.5 30 39 36.8 25 39.6 C11 36.8 1.5 30 1.5 21 Z"
              fill="#fff" mask="url(#logoKnockout)" />
      </svg>

      <nav class="nav">
        <a href="#">Who we are</a>
        <a href="#">Built for you</a>
        <a href="#">Inspiration</a>
        <a href="#">Our produts</a>
        <a href="#">Resources</a>
      </nav>

      <button class="cta" type="button">
        <span class="cta__thumb" aria-hidden="true"></span>
        Request sample
        <svg class="cta__arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 8 h11 M8.5 3.5 L13 8 l-4.5 4.5" stroke="#fff" stroke-width="1.5" />
        </svg>
      </button>
    </header>
  </section>

  <section class="after-hero">
    <p>Move the cursor over the hero &uarr;</p>
  </section>

  <script src="./vendor/three.min.js"></script>
  <script src="./scene.js"></script>
</body>
</html>
