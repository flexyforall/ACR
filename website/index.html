<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CEDUR — The Roof That Makes It Home</title>
  <meta name="description" content="CEDUR brings the warm aesthetic of natural cedar shakes and the enduring performance of engineered materials to every roof." />
  <link rel="preload" href="assets/frames/frame_001.webp" as="image" type="image/webp" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-state="loading">

  <!-- ======================= LOADER (Figma 122:199 → 122:375) ======================= -->
  <div class="loader" id="loader" aria-hidden="true">
    <!-- centered tagline revealed through a collapsing band (122:236);
         each phrase lights up white with a square appearing before it,
         dimming again when the next one lights -->
    <div class="loader__band" id="loaderBand">
      <div class="loader__tagline">
        <p class="tl tl--left"><span class="tl__inner" id="tlLeft"><span class="tl__dot"></span>the&nbsp;&nbsp;roof</span></p>
        <p class="tl tl--home"><span class="tl__inner" id="tlHome"><span class="tl__dot"></span>home</span></p>
        <p class="tl tl--right"><span class="tl__inner" id="tlRight"><span class="tl__dot"></span>that makes it</span></p>
      </div>
    </div>

    <!-- window onto the hero: starts as the 100×100 square (122:206),
         expands to full bleed; shows the same blurred/veiled scene the
         hero opens on, for a seamless hand-off -->
    <div class="loader__window" id="loaderWindow">
      <div class="loader__scene">
        <img src="assets/frames/frame_001.webp" alt="" draggable="false" />
        <div class="loader__veil"></div>
      </div>
    </div>
  </div>

  <!-- ======================= PINNED STAGE: hero + scroll-scrubbed benefits ======================= -->
  <div class="stage" id="stage">
    <div class="stage__pin">

      <!-- the scene: scroll-scrubbed frame sequence. Blurred while in the
           hero (130:541: bg photo blur 100px); it unblurs only after the
           building and the hero copy have left. -->
      <canvas id="scene" class="scene"></canvas>

      <!-- triple black→transparent gradient over the scene (130:542..544) -->
      <div class="veil" id="veil"></div>

      <!-- the building — sharp foreground still (130:627). Parallaxes up
           and out first as you begin to scroll. NOTE: this uses the film's
           establishing frame as a stand-in; drop the exact house PNG at
           assets/house.webp to swap it in (see README). -->
      <div class="building" id="building">
        <img src="assets/frames/frame_001.webp" alt="" draggable="false" />
      </div>

      <!-- fine film grain (130:628 noise) -->
      <div class="noise" id="noise" aria-hidden="true"></div>

      <!-- hero UI (Figma 130:538) — dissolves after the building is gone -->
      <div class="hero2" id="hero2">
        <!-- keep · scrolling · to explore (130:603) -->
        <div class="explore" id="explore">
          <span class="explore__side">keep</span>
          <span class="explore__center">scrolling</span>
          <span class="explore__side">to explore</span>
        </div>

        <!-- THE ROOF THAT MAKES IT HOME — 140px, HOME at 40% (130:565) -->
        <h1 class="slogan slogan--big" id="slogan">
          <span class="sl"><span class="wi" style="--i:0">THE ROOF</span></span>
          <span class="sl"><span class="wi" style="--i:1">THAT MAKES IT</span></span>
          <span class="sl sl--dim"><span class="wi" style="--i:2">HOME</span></span>
        </h1>

        <!-- REQUEST SAMPLE, centered near the bottom (130:595) -->
        <div class="cta cta--center" id="cta">
          <div class="cta__mask">
            <a class="btn" href="#request-sample">
              <span class="btn__label">
                <span class="dot dot--sm"></span>
                <span>REQUEST SAMPLE</span>
              </span>
              <span class="btn__img"><img src="assets/thumb.jpg" alt="" /></span>
            </a>
          </div>
        </div>
      </div>

      <!-- nav (130:356) -->
      <header class="nav" id="nav">
        <a class="nav__logo" href="#" aria-label="CEDUR home">
          <img src="assets/logo.svg" alt="CEDUR" width="50" height="40" />
        </a>
        <div class="nav__right">
          <a class="nav__contact" href="#contact">
            <span class="dot dot--sm"></span>
            <span class="nav__contact-label">contact</span>
          </a>
          <button class="nav__burger" aria-label="Menu">
            <span class="nav__burger-lines">
              <span></span>
              <span></span>
            </span>
          </button>
        </div>
      </header>

      <!-- benefits heading block (130:142): title + rule + progress -->
      <div class="benefits-head" id="benefitsHead">
        <div class="benefits-head__row">
          <h2 class="benefits-head__title" id="benefitTitle"></h2>
        </div>
        <span class="benefits-head__progress" id="ruleProgress"></span>
      </div>

      <!-- benefits paragraph, bottom right (130:146) -->
      <p class="benefits__desc" id="benefitDesc" aria-live="polite"></p>

    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
