<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CEDUR — The Roof That Makes It Home</title>
  <meta name="description" content="CEDUR brings the warm aesthetic of natural cedar shakes and the enduring performance of engineered materials to every roof." />
  <link rel="preload" href="assets/frames/frame_001.webp" as="image" type="image/webp" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-state="loading">

  <!-- ======================= LOADER (Figma 122:199 → 122:375) ======================= -->
  <div class="loader" id="loader" aria-hidden="true">
    <!-- centered tagline revealed through a collapsing band (122:236);
         each phrase lights up white with a square appearing before it,
         dimming again when the next one lights -->
    <div class="loader__band" id="loaderBand">
      <div class="loader__tagline">
        <p class="tl tl--left"><span class="tl__inner" id="tlLeft"><span class="tl__dot"></span>the&nbsp;&nbsp;roof</span></p>
        <p class="tl tl--center"><span class="tl__inner" id="tlCenter"><span class="tl__dot"></span>that makes it</span></p>
        <p class="tl tl--right"><span class="tl__inner" id="tlRight"><span class="tl__dot"></span>home</span></p>
      </div>
    </div>

    <!-- window onto the hero: starts as the 100×100 square (122:206),
         expands to full bleed; shows the same blurred/veiled scene the
         hero opens on, for a seamless hand-off -->
    <div class="loader__window" id="loaderWindow">
      <div class="loader__scene">
        <img src="assets/frames/frame_001.webp" alt="" draggable="false" />
        <div class="loader__veil"></div>
      </div>
    </div>
  </div>

  <!-- ======================= PINNED STAGE: hero + scroll-scrubbed benefits ======================= -->
  <div class="stage" id="stage">
    <div class="stage__pin">

      <!-- the scene: scroll-scrubbed frame sequence, sharp from the start
           (143:410 — no blur); a slow ambient sway plays at rest -->
      <canvas id="scene" class="scene"></canvas>

      <!-- top black→transparent gradient (143:414); fades on scroll -->
      <div class="veil" id="veil"></div>

      <!-- fine film grain overlaid on the video (143:416) — persistent -->
      <div class="noise" id="noise" aria-hidden="true"></div>

      <!-- hero UI (Figma 143:410) — dissolves into the film section -->
      <div class="hero2" id="hero2">
        <!-- hairlines at HOME's cap/baseline (143:418/420), vertical lines
             bracketing the title (146:488/489), plus markers at the four
             intersections (146:490…500) -->
        <span class="hline hline--a"></span>
        <span class="hline hline--b"></span>
        <span class="vline vline--a"></span>
        <span class="vline vline--b"></span>
        <span class="cross" style="--cx:441; --cy:44"></span>
        <span class="cross" style="--cx:999; --cy:44"></span>
        <span class="cross" style="--cx:441; --cy:102"></span>
        <span class="cross" style="--cx:999; --cy:102"></span>

        <!-- /welcome · keep scrolling to explore · /welcome at y216 (143:481) -->
        <div class="explore" id="explore">
          <span class="explore__side">/welcome</span>
          <span class="explore__center">keep scrolling to explore</span>
          <span class="explore__side">/welcome</span>
        </div>

        <!-- THE ROOF THAT MAKES IT HOME — 80px, HOME at 40% (150:697).
             .tw slots bloom open with product imagery after THE / THAT /
             MAKES (never at a line end), one at a time, looped -->
        <h1 class="slogan slogan--big" id="slogan">
          <span class="sl" style="--i:0">THE <span class="tw"><img src="assets/sq1.jpg" alt="" draggable="false"></span>ROOF</span>
          <span class="sl" style="--i:1">THAT <span class="tw"><img src="assets/sq2.jpg" alt="" draggable="false"></span>MAKES <span class="tw"><img src="assets/sq3.jpg" alt="" draggable="false"></span>IT</span>
          <span class="sl sl--dim" style="--i:2">HOME</span>
        </h1>

        <!-- bottom-left paragraph (143:475) -->
        <p class="hero-para">CEDUR brings the warm aesthetic of natural cedar shakes and the enduring performance of engineered materials to every roof.</p>

        <!-- REQUEST SAMPLE, bottom right (143:468) -->
        <div class="cta cta--right" id="cta">
          <div class="cta__mask">
            <a class="btn" href="#request-sample">
              <span class="btn__label">
                <span class="dot dot--xs"></span>
                <span class="roll"><span class="roll__stack"><span>REQUEST SAMPLE</span><span aria-hidden="true">REQUEST SAMPLE</span></span></span>
              </span>
              <span class="btn__img"><img src="assets/thumb.jpg" alt="" /></span>
            </a>
          </div>
        </div>
      </div>

      <!-- nav (130:356) -->
      <header class="nav" id="nav">
        <a class="nav__logo" href="#" aria-label="CEDUR home">
          <img src="assets/logo.svg" alt="CEDUR" width="40" height="32" />
        </a>
        <div class="nav__right">
          <a class="nav__contact" href="#contact">
            <span class="dot dot--xs"></span>
            <span class="roll"><span class="roll__stack"><span class="nav__contact-label">contact</span><span aria-hidden="true">contact</span></span></span>
          </a>
          <button class="nav__burger" aria-label="Menu">
            <span class="nav__burger-lines">
              <span></span>
              <span></span>
            </span>
          </button>
        </div>
      </header>

      <!-- benefits text block, mid-left (150:867): the description sits
           under the title, right-aligned to the title's right edge -->
      <div class="benefits-head" id="benefitsHead">
        <h2 class="benefits-head__title" id="benefitTitle"></h2>
        <p class="benefits__desc" id="benefitDesc" aria-live="polite"></p>
      </div>

      <!-- progress line (150:862): the hero's bottom hairline sinks into
           this y and serves as the track; the bright bar grows per step -->
      <div class="progress" id="progress">
        <span class="progress__bar" id="progressBar"></span>
      </div>

    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
